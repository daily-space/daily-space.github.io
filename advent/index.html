<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d251c">
<title>Декабрь по окошкам · Новогодний адвент</title>
<meta name="description" content="31 зимняя идея: рецепты, фильмы, открытки и маленькие праздничные дела.">
<style>
:root{color-scheme:dark;--forest:#1d251c;--cream:#f4e3c3;--gold:#cdab70;--ink:#682822}
*{box-sizing:border-box}
body{min-height:100svh;margin:0;color:var(--cream);background:radial-gradient(ellipse at 50% 0%,#414633,transparent 76%),var(--forest);font:16px/1.5 system-ui,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background:radial-gradient(#a99971 0.5px,transparent .8px) 0 0/4px 5px,radial-gradient(#080c07 0.6px,transparent 1px) 0 0/5px 7px}
main{position:relative;width:min(1070px,calc(100% - 56px));margin:auto;padding:clamp(23px,5vh,58px) 0 46px}
header{text-align:center;position:relative;margin:0 0 clamp(21px,4vh,39px)}
h1,h2,p{margin:0}
h1{font:normal clamp(46px,7vw,103px)/.9 Georgia,serif;letter-spacing:-.071em}
h1 em{font-weight:normal;color:#e6c891}
header p{margin-top:13px;color:#dfc9a3;font-size:clamp(13px,2.8vw,16px)}
.spark{position:absolute;display:block;color:var(--gold);font:normal clamp(25px,5vw,55px) Georgia,serif;line-height:1}
.spark:first-of-type{left:7%;top:18%}.spark:last-of-type{right:7%;bottom:4%}
.doors{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:clamp(10px,1.65vw,21px);align-items:center;justify-items:center}
.door{position:relative;isolation:isolate;appearance:none;border:0;background:none;color:var(--ink);padding:0;aspect-ratio:1;width:min(100%,110px);cursor:pointer;font:normal clamp(18px,3vw,40px)/1 Georgia,serif;transition:transform .18s ease;filter:drop-shadow(2px 5px 5px #0b0e09bb)}
.door:hover{transform:translateY(-4px) rotate(-3deg)}
.door:focus-visible{outline:2px solid var(--cream);outline-offset:4px}
.door .shape{position:absolute;inset:3%;z-index:-1;border-radius:5px;background:var(--fill,#e6d0a7);box-shadow:inset 0 0 0 1px #f0d7a88c,inset 0 0 0 4px #58432233,inset 0 -5px 7px #4525113c}
.door .shape:before{content:"";position:absolute;inset:7%;border:1px solid #8c60427d;border-radius:inherit}
.door .shape:after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(#55341c4a .5px,transparent .8px) 0 0/4px 5px,linear-gradient(124deg,#fff7e63d,transparent 48%);mix-blend-mode:multiply}
.door.red{--fill:#9f3831;color:#fff0d0}.door.green{--fill:#3b4830;color:#fff0d0}
.door.round .shape{border-radius:50%}.door.arch .shape{border-radius:49% 49% 6px 6px}
.door.tag .shape{clip-path:polygon(16% 0,84% 0,100% 22%,100% 100%,0 100%,0 22%)}
.door.tag .shape:before{width:7px;height:7px;top:8%;left:calc(50% - 4px);background:#342a21;border-radius:50%}
.door.star .shape{inset:0;clip-path:polygon(50% 0,62% 32%,97% 32%,70% 54%,80% 91%,50% 70%,20% 91%,30% 54%,3% 32%,38% 32%);border-radius:0}
.door.star .shape:before{display:none}
.door.flower .shape{border-radius:30% 40% 33% 38%;transform:rotate(15deg)}
.door.striped .shape{background:repeating-linear-gradient(126deg,#ecd8b0 0 10px,#9f3b32 10px 15px,#ecd8b0 15px 19px)}
.door.striped .number{background:#f2e0b9;border-radius:50%;padding:.17em .22em;box-shadow:1px 2px 4px #351d165c}
.door.mail .shape{inset:11% 2%;overflow:hidden}
.door.mail .shape:before{inset:0;border:0;border-radius:0;background:linear-gradient(170deg,#f3d4b880,#74503870);clip-path:polygon(0 0,100% 0,50% 65%);filter:drop-shadow(1px 4px 0 #44281d)}
.door.mail .shape:after{inset:auto auto 28% 45%;width:11%;height:14%;background:#8d3927;border-radius:50%;border:1px solid #dca26e;mix-blend-mode:normal}
.door.mail .number{position:relative;top:-10%}
.door.final{grid-column:span 2;width:min(100%,210px);height:min(100%,110px);aspect-ratio:2;--fill:#792d2a;color:#f6d59b}
.door.final .shape{border-radius:12px;border:1px solid #dab27d}
.door.final .shape:before{border:1px dashed #dab27d}
.door.final .number:before,.door.final .number:after{content:"✦";font-size:.45em;margin:0 .75em;vertical-align:middle;color:var(--gold)}
dialog{color-scheme:light;max-height:min(88svh,850px);width:min(640px,calc(100% - 24px));border:1px solid #a44c3e;border-radius:10px;padding:0;color:#4c3025;background:#fff1d8;box-shadow:0 19px 48px #080c0870}
dialog::backdrop{background:#111a12bd}
.panel{padding:19px clamp(16px,5vw,35px) 28px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;color:#7c392e;font-size:13px}
.close,.arrows button{border:0;background:#ead7b5;color:#612e28;border-radius:50%;width:36px;height:36px;font-size:23px;cursor:pointer}
h2{font:italic clamp(28px,6vw,43px)/1.03 Georgia,serif;color:#762d28}
#description{margin:12px 0}
figure{margin:16px 0 13px}
figure img{display:block;width:100%;height:clamp(210px,42svh,380px);object-fit:contain;background:#e8d6b7;border-radius:4px}
figcaption{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-top:5px;color:#67483d;font-size:12px}
.arrows{display:flex;align-items:center;gap:7px}
.arrows[hidden],a[hidden],p[hidden]{display:none}
#extra{border-top:1px solid #cfaa81;padding-top:11px}
#action{display:inline-block;background:#91382d;color:#fff3dc;border-radius:4px;padding:9px 14px;text-underline-offset:3px;margin-top:12px}
#action[hidden]{display:none}
@media(max-width:740px){main{width:min(560px,calc(100% - 24px));padding-top:31px}.doors{grid-template-columns:repeat(5,minmax(0,1fr));gap:11px 9px}.door{font-size:clamp(20px,5vw,32px);width:min(100%,83px)}.door.final{grid-column:1/-1;height:54px;width:145px}.spark:first-of-type{left:1%;top:-14%}.spark:last-of-type{right:1%;bottom:14%}}
@media(max-width:380px){main{padding-top:23px}h1{font-size:43px}.doors{gap:8px 6px}.spark:last-of-type{right:0;bottom:8%;font-size:17px}}
@media(prefers-reduced-motion:reduce){.door{transition:none}}
</style>
<script src="days.js" defer></script>
</head>
<body>
<main>
<header>
<span class="spark" aria-hidden="true">✧</span>
<h1>Декабрь<br><em>по окошкам</em></h1>
<p>31 идея, чтобы почувствовать Новый год</p>
<span class="spark" aria-hidden="true">✦</span>
</header>
<div id="doors" class="doors" aria-label="Окошки адвента"></div>
</main>
<dialog id="detail" aria-labelledby="day-title">
<div class="panel">
<div class="bar"><span id="day-number"></span><form method="dialog"><button class="close" type="submit" aria-label="Закрыть">×</button></form></div>
<h2 id="day-title"></h2>
<p id="description"></p>
<figure>
<img id="picture" alt="">
<figcaption><span id="credit"></span><span class="arrows" id="arrows"><button id="prev" type="button" aria-label="Предыдущее фото">‹</button><span id="count"></span><button id="next" type="button" aria-label="Следующее фото">›</button></span></figcaption>
</figure>
<p id="extra"></p>
<a id="action" hidden></a>
</div>
</dialog>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const byId=id=>document.getElementById(id);
  const detail=byId('detail');
  const shapes=['mail','flower green','striped','tag','round red','star','arch','mail red','round striped','green','striped','flower green','tag','star','red','round','arch red','striped','flower green','tag','','star','red','arch','round green','mail','flower red','striped','tag','arch green','final'];
  let gallery=[],position=0;
  function showPhoto(){
    const index=gallery[position];
    byId('picture').src='img/'+index+'.jpg';
    byId('credit').textContent=index===24?'Открытка из «Декабрьской почты»':'Фото: Pinterest';
    byId('count').textContent=(position+1)+' / '+gallery.length;
    byId('arrows').hidden=gallery.length<2;
  }
  function openDay(day,index){
    const [name,description,extra,photos,label,url]=day;
    byId('day-number').textContent='Окошко '+(index+1);
    byId('day-title').textContent=name;
    byId('description').textContent=description;
    byId('extra').textContent=extra.trim();
    byId('extra').hidden=!extra.trim();
    const link=byId('action');
    link.hidden=!url;
    if(url){link.href=url;link.textContent=label+' ↗'}
    gallery=photos.split(',').map(Number);
    position=0;
    showPhoto();
    detail.showModal();
    detail.scrollTop=0;
  }
  byId('prev').onclick=()=>{position=(position+gallery.length-1)%gallery.length;showPhoto()};
  byId('next').onclick=()=>{position=(position+1)%gallery.length;showPhoto()};
  detail.addEventListener('click',event=>{if(event.target===detail)detail.close()});
  days.forEach((day,index)=>{
    const button=document.createElement('button');
    button.type='button';
    button.className='door '+shapes[index];
    button.setAttribute('aria-label','Открыть окошко '+(index+1));
    const shape=document.createElement('span');
    shape.className='shape';
    shape.setAttribute('aria-hidden','true');
    const number=document.createElement('span');
    number.className='number';
    number.textContent=index+1;
    button.append(shape,number);
    button.onclick=()=>openDay(day,index);
    byId('doors').append(button);
  });
});
</script>
</body>
</html>
