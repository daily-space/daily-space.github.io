<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d251c">
<title>Декабрь по окошкам · Новогодний адвент</title>
<meta name="description" content="31 зимняя идея: рецепты, фильмы, открытки и маленькие праздничные дела.">
<style>
:root{color-scheme:dark;--forest:#1d251c;--cream:#f4e3c3;--gold:#cdab70;--ink:#682822}
*{box-sizing:border-box}
body{min-height:100svh;margin:0;color:var(--cream);background:radial-gradient(ellipse at 50% 0%,#414633,transparent 76%),var(--forest);font:16px/1.5 system-ui,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background:radial-gradient(#a99971 0.5px,transparent .8px) 0 0/4px 5px,radial-gradient(#080c07 0.6px,transparent 1px) 0 0/5px 7px}
main{position:relative;min-height:100svh;width:min(1180px,calc(100% - 64px));margin:auto;display:grid;grid-template-columns:minmax(0,.84fr) minmax(0,1.16fr);align-items:center;gap:clamp(24px,5vw,78px);padding:34px 0}
header{position:relative;padding:36px 0}
h1,h2,p{margin:0}
h1{font:normal clamp(46px,7vw,99px)/.85 Georgia,serif;letter-spacing:-.075em}
h1 em{font-weight:normal;color:#e6c891} h1 span{display:block;margin-left:.35em}
header p{margin-top:21px;max-width:25ch;color:#f4e3c3;font:clamp(16px,2vw,21px)/1.4 Georgia,serif}
.countdown{margin-top:30px;color:#e6c891}
.countdown-label{font:13px Georgia,serif;letter-spacing:.11em;text-transform:uppercase}
.clock{display:flex;gap:clamp(8px,2vw,21px);margin-top:6px}
.clock span{display:flex;flex-direction:column;min-width:2.5rem;color:#e6c891;font:12px/1.3 system-ui,sans-serif}
.clock b{font:clamp(24px,3.7vw,48px)/1.05 Georgia,serif;font-variant-numeric:tabular-nums;color:#fae5be}
.spark{position:absolute;display:block;color:var(--gold);font:normal clamp(25px,5vw,55px) Georgia,serif;line-height:1}
.spark{right:3%;top:0}
.doors{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(9px,1.4vw,17px);align-items:center;justify-items:center}
.door{position:relative;isolation:isolate;appearance:none;border:0;background:none;color:var(--ink);padding:0;aspect-ratio:1;width:min(100%,110px);cursor:pointer;font:normal clamp(18px,3vw,40px)/1 Georgia,serif;transition:transform .18s ease;filter:drop-shadow(2px 5px 5px #0b0e09bb)}
.door:hover{transform:translateY(-4px) rotate(-3deg)}
.door:focus-visible{outline:2px solid var(--cream);outline-offset:4px}
.door .shape{position:absolute;inset:3%;z-index:-1;border-radius:5px;background:var(--fill,#e6d0a7);box-shadow:inset 0 0 0 1px #f0d7a88c,inset 0 0 0 4px #58432233,inset 0 -5px 7px #4525113c}
.door .shape:before{content:"";position:absolute;inset:7%;border:1px solid #8c60427d;border-radius:inherit}
.door .shape:after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(#55341c4a .5px,transparent .8px) 0 0/4px 5px,linear-gradient(124deg,#fff7e63d,transparent 48%);mix-blend-mode:multiply}
.door.red{--fill:#9f3831;color:#fff0d0}.door.green{--fill:#3b4830;color:#fff0d0}
.door.round .shape{border-radius:50%}.door.arch .shape{border-radius:49% 49% 6px 6px}
.door.tag .shape{clip-path:polygon(16% 0,84% 0,100% 22%,100% 100%,0 100%,0 22%)}
.door.tag .shape:before{width:7px;height:7px;top:8%;left:calc(50% - 4px);background:#342a21;border-radius:50%}
.door.star .shape{inset:0;clip-path:polygon(50% 0,62% 32%,97% 32%,70% 54%,80% 91%,50% 70%,20% 91%,30% 54%,3% 32%,38% 32%);border-radius:0}
.door.star .shape:before{display:none}
.door.flower .shape{border-radius:30% 40% 33% 38%;transform:rotate(15deg)}
.door.striped .shape{background:repeating-linear-gradient(126deg,#ecd8b0 0 10px,#9f3b32 10px 15px,#ecd8b0 15px 19px)}
.door.striped .number{background:#f2e0b9;border-radius:50%;padding:.17em .22em;box-shadow:1px 2px 4px #351d165c}
.door.mail .shape{inset:11% 2%;overflow:hidden}
.door.mail .shape:before{inset:0;border:0;border-radius:0;background:linear-gradient(170deg,#f3d4b880,#74503870);clip-path:polygon(0 0,100% 0,50% 65%);filter:drop-shadow(1px 4px 0 #44281d)}
.door.mail .shape:after{inset:auto auto 28% 45%;width:11%;height:14%;background:#8d3927;border-radius:50%;border:1px solid #dca26e;mix-blend-mode:normal}
.door.mail .number{position:relative;top:-10%}
.door.final{grid-column:3/span 2;width:min(100%,198px);height:clamp(50px,7vw,90px);aspect-ratio:2;--fill:#792d2a;color:#f6d59b}
.door.final .shape{border-radius:12px;border:1px solid #dab27d}
.door.final .shape:before{border:1px dashed #dab27d}
.door.final .number:before,.door.final .number:after{content:"✦";font-size:.45em;margin:0 .75em;vertical-align:middle;color:var(--gold)}
dialog{color-scheme:light;inset:0;margin:0;width:100%;height:100dvh;max-width:none;max-height:none;border:0;padding:0;overflow:hidden;color:#4c3025;background:#fff1d8}
.panel{height:100%;max-width:1230px;margin:auto;display:flex;flex-direction:column;padding:clamp(12px,3vw,34px);padding-bottom:max(12px,env(safe-area-inset-bottom));gap:10px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#7c392e;font-size:13px;flex:none}
.close,.arrows button{border:0;background:#ead7b5;color:#612e28;border-radius:50%;width:38px;height:38px;font-size:23px;cursor:pointer}
.day-body{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(20px,5vw,62px)}
.day-copy{max-height:100%;overflow:auto;align-self:center}
.day-actions{flex:none;display:flex;align-items:center;gap:8px}
.day-actions:has(.action[hidden]):not(:has(.action:not([hidden]))){display:none}
.craft h3{font:italic 28px/1.1 Georgia,serif;margin:0 0 10px;color:#762d28}
.craft p+p{margin-top:9px}
.craft[hidden]{display:none}
h2{font:italic clamp(28px,6vw,43px)/1.03 Georgia,serif;color:#762d28}
#description{margin:12px 0}
figure{margin:0;width:min(100%,calc(100dvh - 170px));justify-self:center}
.photo-frame{position:relative;aspect-ratio:1;background:#e8d6b7;border-radius:5px;overflow:hidden}
.photo-frame img{display:block;width:100%;height:100%;object-fit:cover}
figure:has([data-photo="46"]){width:min(100%,calc((100dvh - 170px) * .8))}
.photo-frame:has([data-photo="46"]){aspect-ratio:4/5}
.photo-frame img[hidden]{display:none}
.photo-frame[aria-busy="true"]:empty::after,.photo-frame[aria-busy="true"]:has(img[hidden])::after{content:"Загружаю фото…";display:grid;place-items:center;position:absolute;inset:0;color:#67483d;font-size:13px}
.photo-frame img[data-photo="7"]{object-position:center 70%}
.photo-frame img[data-photo="17"]{object-position:center 40%}
.photo-frame img[data-photo="18"]{object-position:center 15%}
figcaption{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-top:5px;color:#67483d;font-size:12px}
.arrows{display:flex;align-items:center;gap:7px}
.arrows[hidden],a[hidden],p[hidden],figure[hidden],[hidden]{display:none}
#extra{border-top:1px solid #cfaa81;padding-top:11px}
.action{display:inline-block;background:#91382d;color:#fff3dc;border-radius:999px;padding:10px 19px;text-decoration:none}
.action[hidden]{display:none}
button.action{font:inherit;border:0}
.day-body:has(figure[hidden]){grid-template-columns:minmax(0,660px);justify-content:center}
.action:disabled{opacity:.78;cursor:default}
.action-note{font-size:12px;color:#67483d;margin-left:8px}
@media(max-width:740px){main{min-height:0;display:block;width:min(520px,calc(100% - 30px));padding:27px 0 35px}header{text-align:center;padding:0;margin-bottom:21px}h1{font-size:clamp(41px,10.5vw,65px)}h1 span{margin:0}header p{margin:11px auto 0;font-size:15px}.countdown{margin-top:14px}.countdown-label{font-size:11px}.clock{justify-content:center;gap:13px;margin-top:3px}.clock b{font-size:26px}.clock span{font-size:10px}.spark{right:2%;top:16%;font-size:23px}.doors{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 7px}.door{font-size:clamp(20px,5vw,30px);width:min(100%,77px)}.door.final{grid-column:1/-1;height:49px;width:141px}}
@media(max-width:380px){main{padding-top:21px}.doors{gap:7px 5px}.spark{right:0;font-size:16px}}
@media(max-width:740px){
 .panel{padding-inline:14px;gap:7px}
 .day-body{display:flex;flex-direction:column;align-items:stretch;gap:9px}
 .day-copy{flex:1;min-height:0;width:100%;padding-bottom:4px}
 figure{align-self:center;flex:none;width:min(100%,40dvh)}
 figure:has([data-photo="46"]){width:min(100%,33dvh)}
 h2{font-size:26px}#description{margin:6px 0 9px}
 .craft h3{font-size:23px;margin-bottom:4px}.craft p{font-size:14px}.craft p+p{margin-top:5px}
 .day-actions .action{font-size:14px}
}
@media(prefers-reduced-motion:reduce){.door{transition:none}}
</style>
<script src="days.js?v=podarki" defer></script>
</head>
<body>
<main>
<header>
<span class="spark" aria-hidden="true">✧</span>
<h1><em>Адвент-</em><span>календарь</span></h1>
<div class="countdown" role="timer" aria-label="До Нового года">
<div class="countdown-label">До Нового года</div>
<div class="clock"><span><b id="days-left">—</b>дни</span><span><b id="hours-left">—</b>часы</span><span><b id="minutes-left">—</b>минуты</span><span><b id="seconds-left">—</b>секунды</span></div>
</div>
<p>Открывай окошки и&nbsp;погружайся в&nbsp;атмосферу праздника.</p>
</header>
<div id="doors" class="doors" aria-label="Окошки адвента"></div>
</main>
<dialog id="detail" aria-labelledby="day-title">
<div class="panel">
<div class="bar"><span id="day-number"></span><form method="dialog"><button class="close" type="submit" aria-label="Закрыть">×</button></form></div>
<div class="day-body">
<figure id="gallery">
<div class="photo-frame" id="photo-frame"></div>
<figcaption><span id="credit"></span><span class="arrows" id="arrows"><button id="prev" type="button" aria-label="Предыдущее фото">‹</button><span id="count"></span><button id="next" type="button" aria-label="Следующее фото">›</button></span></figcaption>
</figure>
<div class="day-copy">
<h2 id="day-title"></h2>
<p id="description"></p>
<section class="craft" id="craft" hidden>
<h3 id="craft-title"></h3>
<p><strong>Что понадобится</strong><br><span id="materials"></span></p>
<p><strong>Как делать</strong><br><span id="steps"></span></p>
</section>
<p id="extra"></p>
</div>
</div>
<div class="day-actions">
<a class="action" id="action" hidden></a>
<button class="action" type="button" id="coming-soon" disabled hidden></button><span class="action-note" id="coming-soon-note" hidden>Скоро</span>
</div>
</div>
</dialog>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const byId=id=>document.getElementById(id);
  const detail=byId('detail');
  const moscowYear=new Intl.DateTimeFormat('en',{timeZone:'Europe/Moscow',year:'numeric'});
  function updateCountdown(){
    const now=new Date();
    const nextYear=Number(moscowYear.format(now))+1;
    const deadline=Date.parse(nextYear+'-01-01T00:00:00+03:00');
    let seconds=Math.max(0,Math.floor((deadline-now)/1000));
    for(const [id,divisor] of [['days-left',86400],['hours-left',3600],['minutes-left',60],['seconds-left',1]]){
      byId(id).textContent=String(Math.floor(seconds/divisor)).padStart(2,'0');
      seconds%=divisor;
    }
  }
  updateCountdown();
  setInterval(updateCountdown,1000);
  const shapes=['mail','flower green','striped','tag','round red','star','arch','mail red','round striped','green','striped','flower green','tag','star','red','round','arch red','striped','flower green','tag','','star','red','arch','round green','mail','flower red','striped','tag','arch green','final'];
  const crafts={
    1:['Гирлянда из сушек','Нитка или бечёвка, сушки, красная ленточка.','Продень нитку через сушки и распредели их по длине. Между несколькими сушками завяжи бантики. На концах нитки сделай петли и повесь гирлянду.'],
    3:['Гирлянда из вязаных бантиков','Пряжа двух цветов, крючок под толщину пряжи, ножницы.','Свяжи плотные полоски, как в видео. Сложи каждую петельками, перехвати середину ниткой и расправь кончики. Чередуй цвета и привяжи бантики к длинному вязаному шнурку.','https://www.youtube.com/watch?v=DhcYS1ystb4'],
    2:['Бумажная растяжка','Плотная красная бумага, карандаш, ножницы, нитка, скотч.','Нарисуй и вырежи буквы для фразы «С Новым годом!». Разложи их по порядку, прикрепи с обратной стороны к нитке и повесь растяжку.'],
    4:['Бумажные цепочки и звёзды','Цветная бумага, линейка, карандаш, ножницы, клей и нитка.','Нарежь полоски. Склей первую в кольцо, продень в неё следующую и тоже склей. Для подвесной звезды вырежи два одинаковых силуэта, надрежь один от верхнего луча до середины, другой снизу. Вставь детали друг в друга и привяжи нитку.']
  };
  let gallery=[],position=0,craftDay=false;
  function setAction(label,url){
    const link=byId('action');
    link.hidden=!url;
    if(url){link.href=url;link.textContent=label}
    else link.removeAttribute('href');
    const comingSoon=byId('coming-soon');
    comingSoon.hidden=byId('coming-soon-note').hidden=!label||!!url;
    comingSoon.textContent=label||'';
  }
  function showCraft(photo){
    const [name,materials,steps,video]=crafts[photo];
    byId('craft-title').textContent=name;
    byId('materials').textContent=materials;
    byId('steps').textContent=steps;
    setAction(video?'Смотреть видеоурок':'',video);
    document.querySelector('.day-copy').scrollTop=0;
  }
  function showPhoto(){
    const index=gallery[position];
    if(craftDay)showCraft(index);
    const frame=byId('photo-frame');
    const picture=new Image();
    picture.id='picture';
    picture.dataset.photo=index;
    picture.alt=byId('day-title').textContent;
    picture.hidden=true;
    frame.replaceChildren(picture);
    frame.setAttribute('aria-busy','true');
    picture.src='img/'+index+'.jpg';
    picture.decode().then(()=>{
      if(picture.parentElement!==frame)return;
      picture.hidden=false;
      frame.setAttribute('aria-busy','false');
    }).catch(()=>{
      if(picture.parentElement!==frame)return;
      frame.replaceChildren(document.createTextNode('Фото не загрузилось.'));
      frame.setAttribute('aria-busy','false');
    });
    byId('credit').textContent=index===46?'Обложка стикерпака':index===24?'Открытка из «Декабрьской почты»':'Фото: Pinterest';
    byId('count').textContent=(position+1)+' / '+gallery.length;
    byId('arrows').hidden=gallery.length<2;
  }
  function openDay(day,index){
    const [name,description,extra,photos,label,url]=day;
    byId('day-number').textContent='Окошко '+(index+1);
    byId('day-title').textContent=name;
    craftDay=index===0;
    byId('description').textContent=craftDay?'Листай фото, чтобы выбрать идею.':description;
    byId('craft').hidden=!craftDay;
    byId('extra').textContent=extra.trim();
    byId('extra').hidden=craftDay||!extra.trim();
    setAction(label,url);
    gallery=craftDay?[1,3,2,4]:photos?photos.split(',').map(Number):[];
    position=0;
    byId('gallery').hidden=!gallery.length;
    if(gallery.length)showPhoto();
    else byId('photo-frame').replaceChildren();
    detail.showModal();
    document.querySelector('.day-copy').scrollTop=0;
  }
  byId('prev').onclick=()=>{position=(position+gallery.length-1)%gallery.length;showPhoto()};
  byId('next').onclick=()=>{position=(position+1)%gallery.length;showPhoto()};
  detail.addEventListener('click',event=>{if(event.target===detail)detail.close()});
  days.forEach((day,index)=>{
    const button=document.createElement('button');
    button.type='button';
    button.className='door '+shapes[index];
    button.setAttribute('aria-label','Открыть окошко '+(index+1));
    const shape=document.createElement('span');
    shape.className='shape';
    shape.setAttribute('aria-hidden','true');
    const number=document.createElement('span');
    number.className='number';
    number.textContent=index+1;
    button.append(shape,number);
    button.onclick=()=>openDay(day,index);
    byId('doors').append(button);
  });
});
</script>
</body>
</html>
