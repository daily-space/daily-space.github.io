<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15352b">
<meta name="description" content="Выбери настроение и получи фильм на вечер из зимней подборки.">
<title>Киновечер · Рандомайзер фильмов</title>
<style>
:root{color-scheme:dark;--cream:#fff0d3;--soft:#e5dbba;--red:#a72d3b;--gold:#e9bd72;--ticket:#f8ebce;--ink:#65252d}
*{box-sizing:border-box}
body{min-height:100svh;margin:0;color:var(--cream);font:16px/1.45 system-ui,sans-serif;background:
 radial-gradient(circle at 15% 17%,#f7edc95c 0 1px,transparent 1.8px) 0 0/93px 98px,
 radial-gradient(circle at 71% 38%,#f7edc92c 0 1px,transparent 2px) 0 0/67px 79px,
 radial-gradient(ellipse at 78% 45%,#315748,transparent 63%),#15352b}
.wrap{width:min(1120px,calc(100% - 64px));margin:0 auto}
.mast{display:flex;justify-content:space-between;align-items:center;min-height:62px;border-bottom:1px solid #e9bd7259;gap:12px}
.brand{font:italic 25px Georgia,serif;white-space:nowrap}
.brand span{color:var(--gold);font:normal 17px Georgia,serif;margin-right:6px}
a{color:inherit;text-underline-offset:4px}
.mast a{font-size:13px;color:var(--soft)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.94fr);align-items:center;gap:clamp(28px,6vw,90px);min-height:calc(100svh - 62px);padding:34px 0}
h1,h2,p{margin:0}
h1{font:normal clamp(49px,7vw,102px)/.9 Georgia,serif;letter-spacing:-.055em}
h1 em{font-weight:normal;color:var(--gold)}
.intro{margin:16px 0 20px;color:var(--soft)}
fieldset{min-width:0;padding:0;border:0;margin:0 0 20px}
legend{padding:0;margin:0 0 8px;font-size:14px}
.moods{display:flex;flex-wrap:wrap;gap:7px}
button{font:inherit;cursor:pointer;border:none}
.mood{padding:7px 13px;border-radius:30px;background:#375648;color:var(--cream);font-size:13px}
.mood[aria-pressed="true"]{background:var(--cream);color:#204536}
button:focus-visible,a:focus-visible{outline:2px solid #fff7df;outline-offset:3px}
.draw{background:var(--red);color:#fff5df;border-radius:4px;padding:11px 21px;font-weight:700}
.draw:hover{background:#bc3949}
.ticket{position:relative;color:var(--ink);background:
 repeating-linear-gradient(135deg,#a72d3b 0 7px,#f8ebce 7px 14px,#37634e 14px 21px,#f8ebce 21px 28px);
 border-radius:5px;box-shadow:0 18px 45px #0b1e174f;padding:8px;margin-top:18px}
.ticket-inner{min-height:292px;display:flex;flex-direction:column;text-align:center;background:
 radial-gradient(#91744936 .55px,transparent .8px) 0 0/5px 5px,var(--ticket);border:1px solid #b99b69}
.stub{padding:10px 12px;border-bottom:1px dashed #b99b69;color:#764732;letter-spacing:.10em;text-transform:uppercase;font:12px/1.3 monospace}
.bow{position:absolute;left:50%;top:-12px;transform:translateX(-50%);height:20px;width:12px;border-radius:4px;background:#a72d3b;pointer-events:none}
.bow::before,.bow::after{content:"";position:absolute;bottom:5px;width:28px;height:15px;border:4px solid #a72d3b;background:#a72d3b;border-radius:60% 60% 4px 60%;z-index:-1}
.bow::before{right:5px;transform:rotate(16deg)}
.bow::after{left:5px;transform:scaleX(-1) rotate(16deg)}
.result{padding:16px 20px 20px;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px}
.ornament{color:#886128;font-size:19px;line-height:1}
h2{font:italic clamp(26px,3.5vw,45px)/.99 Georgia,serif;letter-spacing:-.035em;text-wrap:balance}
.film-meta{font-size:13px;color:#704333}
.description{font-size:14px;line-height:1.36;max-width:305px}
[hidden]{display:none!important}
@media(max-width:740px){
 .wrap{width:calc(100% - 32px)}.mast{min-height:46px}.brand{font-size:19px}.mast a{font-size:12px}
 main{min-height:calc(100svh - 46px);align-content:center;gap:16px;grid-template-columns:1fr;padding:16px 0}
 h1{font-size:clamp(38px,9.5vw,56px)}.intro{margin:9px 0 11px;font-size:13px}fieldset{margin-bottom:11px}
 legend{margin-bottom:6px;font-size:13px}.moods{gap:5px}.mood{padding:6px 10px;font-size:12px}
 .draw{padding:9px 16px;font-size:14px}.ticket{margin-top:8px;padding:6px}.ticket-inner{min-height:176px}
 .stub{font-size:10px;padding:8px 10px}.result{padding:9px 12px 12px;gap:5px}.description{font-size:13px}
}
@media(max-width:740px) and (max-height:640px){
 main{gap:12px;padding:11px 0}.mast{min-height:40px}main{min-height:calc(100svh - 40px)}
 h1{font-size:clamp(32px,9.2vw,44px)}.intro{margin:6px 0 8px}.ticket-inner{min-height:154px}
 .result{padding:7px 11px 9px}.ornament{font-size:14px}h2{font-size:24px}
}
@media(min-width:741px) and (max-height:550px){
 main{padding:10px 0}h1{font-size:clamp(38px,5.7vw,62px)}.intro{margin:8px 0 10px}
 fieldset{margin-bottom:11px}.ticket-inner{min-height:225px}
}
</style>
</head>
<body>
<header class="wrap mast">
  <span class="brand"><span aria-hidden="true">✦</span>Киновечер</span>
  <a href="../otkrytki/">Конструктор открыток</a>
</header>
<main class="wrap">
  <section aria-labelledby="title">
    <h1 id="title">Новогодний <em>киновечер</em></h1>
    <p class="intro">Выбери настроение, и я предложу фильм.</p>
    <fieldset>
      <legend>Чего хочется сегодня?</legend>
      <div class="moods" id="moods">
        <button class="mood" type="button" data-mood="all" aria-pressed="true">Любое</button>
        <button class="mood" type="button" data-mood="holiday" aria-pressed="false">Праздника</button>
        <button class="mood" type="button" data-mood="laugh" aria-pressed="false">Посмеяться</button>
        <button class="mood" type="button" data-mood="romance" aria-pressed="false">Романтики</button>
        <button class="mood" type="button" data-mood="magic" aria-pressed="false">Сказки</button>
        <button class="mood" type="button" data-mood="family" aria-pressed="false">Смотреть вместе</button>
      </div>
    </fieldset>
    <button type="button" class="draw" id="draw">Выбрать фильм</button>
  </section>
  <section class="ticket" aria-label="Билет на киновечер">
    <span class="bow" aria-hidden="true"></span>
    <div class="ticket-inner">
      <p class="stub">Билет на сегодня</p>
      <div class="result" aria-live="polite" aria-atomic="true">
        <span class="ornament" aria-hidden="true">✦</span>
        <h2 id="film-title">Твой фильм на вечер</h2>
        <p class="film-meta" id="film-meta" hidden></p>
        <p class="description" id="film-description">Новогодние и рождественские фильмы</p>
      </div>
    </div>
  </section>
</main>
<script>
const films = [
  ['Один дома',1990,'Семейная комедия',['holiday','laugh','family'],'Кевин остаётся один на Рождество и решает превратить дом в полосу препятствий для двух грабителей.'],
  ['Отпуск по обмену',2006,'Романтическая комедия',['holiday','romance'],'Две незнакомки меняются домами на праздники. Одна едет в английскую деревню, вторая в солнечную Калифорнию.'],
  ['Реальная любовь',2003,'Романтическая комедия',['holiday','romance'],'Несколько историй о любви в Лондоне за несколько недель до Рождества.'],
  ['Клаус',2019,'Анимация',['holiday','magic','family'],'Почтальон и мастер игрушек пытаются растопить лёд в городке, где соседи годами ссорятся.'],
  ['Эльф',2003,'Семейная комедия',['holiday','laugh','family'],'Добряк, выросший среди эльфов, отправляется в Нью-Йорк искать своего папу.'],
  ['Гринч',2018,'Анимация',['holiday','laugh','family'],'Зелёный ворчун придумывает, как украсть Рождество у целого города.'],
  ['Рождественские хроники',2018,'Семейное приключение',['holiday','magic','family'],'Брат и сестра пытаются снять Санту на камеру, а в итоге помогают ему спасти Рождество.'],
  ['Пока ты спал',1995,'Романтическая комедия',['holiday','laugh','romance'],'После случайного знакомства семья незнакомца принимает Люси за его невесту.'],
  ['Интуиция',2001,'Романтическая комедия',['romance','holiday'],'Двое знакомятся в предрождественском Нью-Йорке и решают доверить следующую встречу случаю.'],
  ['Чудо на 34-й улице',1947,'Семейная сказка',['holiday','magic','family'],'Санта из универмага утверждает, что он настоящий. Убедить в этом взрослых оказывается труднее, чем детей.'],
  ['Рождество на двоих',2019,'Романтическая комедия',['holiday','romance'],'Кейт работает эльфом в магазине рождественских украшений. Знакомство с Томом меняет её привычный маршрут по Лондону.'],
  ['Хроники Нарнии: Лев, колдунья и волшебный шкаф',2005,'Фэнтези',['magic','family'],'За дверцей шкафа четверо детей находят страну, где зима никак не закончится.'],
  ['Полярный экспресс',2004,'Анимация',['holiday','magic','family'],'В канун Рождества мальчик садится в поезд, который идёт прямиком на Северный полюс.'],
  ['Секретная служба Санта-Клауса',2011,'Анимация',['holiday','magic','family'],'Сын Санты отправляется доставить подарок девочке, которую случайно пропустили.'],
  ['Карнавальная ночь',1956,'Музыкальная комедия',['holiday','laugh','family'],'Команда Дома культуры готовит новогодний концерт, пока начальник пытается превратить его в скучное собрание.'],
  ['Чародеи',1982,'Музыкальная сказка',['holiday','magic','romance'],'В институте волшебства готовятся к Новому году, а Ваня пытается снять заклятие с Алёны.'],
  ['Ирония судьбы, или С лёгким паром!',1975,'Романтическая комедия',['holiday','laugh','romance'],'Одинаковые адреса и ключи отправляют Женю в чужую квартиру в новогоднюю ночь.'],
  ['Подарок на Рождество',1996,'Комедия',['holiday','laugh','family'],'Накануне Рождества два отца охотятся за одной и той же игрушкой, которую пообещали детям.'],
  ['Семьянин',2000,'Романтическая драма',['holiday','romance','magic'],'В рождественское утро Джек просыпается в жизни, которую мог бы выбрать много лет назад.'],
  ['Рождественская история',2009,'Анимация',['holiday','magic'],'Три духа показывают Скруджу его прошлое, настоящее и будущее за одну рождественскую ночь.']
];
const moodButtons=[...document.querySelectorAll('.mood')];
const drawButton=document.getElementById('draw');
const title=document.getElementById('film-title');
const meta=document.getElementById('film-meta');
const description=document.getElementById('film-description');
const seenByMood=new Map();
let mood='all';
let lastFilm;
for(const button of moodButtons){
  button.addEventListener('click',()=>{
    mood=button.dataset.mood;
    for(const option of moodButtons)option.setAttribute('aria-pressed',option===button);
    drawButton.textContent='Выбрать фильм';
    title.textContent='Твой фильм на вечер';
    meta.hidden=true;
    description.textContent='Нажми на кнопку, чтобы открыть билет.';
  });
}
drawButton.addEventListener('click',()=>{
  const eligible=films.filter(film=>mood==='all'||film[3].includes(mood));
  let seen=seenByMood.get(mood);
  if(!seen||seen.size===eligible.length){
    seen=new Set();
    seenByMood.set(mood,seen);
  }
  const fresh=eligible.filter(film=>!seen.has(film));
  const alternatives=fresh.filter(film=>film!==lastFilm);
  const pool=alternatives.length?alternatives:fresh;
  const film=pool[Math.floor(Math.random()*pool.length)];
  seen.add(film);
  lastFilm=film;
  const [name,year,genre,,summary]=film;
  title.textContent=name;
  meta.textContent=year+' · '+genre;
  meta.hidden=false;
  description.textContent=summary;
  drawButton.textContent='Предложить другой';
});
</script>
</body>
</html>
