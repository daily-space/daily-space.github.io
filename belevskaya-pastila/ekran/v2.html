<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Белёвская пастила · буквы-слои</title>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Playfair+Display:ital,wght@1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#206C2D;--green-d:#13421C;--green-dd:#0D2E14;--apple:#CBD879;--paper:#F7F0E2;--cream:#EFE2C9;--crust:#B9804A;--crust-d:#7B4A24;--ink:#26201A;--berry:#9C2A39;
--disp:'Prata',Georgia,serif;--it:'Playfair Display',Georgia,serif;--body:'Manrope',system-ui,sans-serif;--pad:clamp(16px,3.2vw,48px);--hdr:64px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%} a{color:inherit;text-decoration:none} button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
.hdr{position:fixed;z-index:60;top:12px;left:var(--pad);right:var(--pad);height:var(--hdr);display:flex;align-items:center;gap:18px;padding:0 10px 0 12px;border-radius:999px}
.brand{display:flex;align-items:center;gap:10px} .brand img{width:54px} .brand span{font:400 17px/1.05 var(--disp);color:var(--green-d)}
.nav{display:flex;gap:2px;margin:0 auto} .nav a{font-size:14px;font-weight:500;padding:9px 14px;border-radius:999px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 28px;border-radius:999px;background:var(--green);color:var(--paper);font-weight:600;font-size:15px;white-space:nowrap;transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .25s,box-shadow .3s}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 14px 30px rgba(19,66,28,.28)}
.btn.soft{background:rgba(32,108,45,.1);color:var(--green)} .btn.light{background:var(--paper);color:var(--green-d)} .btn.glass{background:rgba(247,240,226,.14);color:var(--paper)}
.btn.sm{height:42px;padding:0 20px;font-size:14px}
.burger{display:none;width:46px;height:46px;border-radius:50%;background:var(--green);place-items:center;margin-left:auto}
.burger i{display:block;width:18px;height:2px;background:var(--paper);border-radius:2px;box-shadow:0 -6px 0 var(--paper),0 6px 0 var(--paper)}
.dk .brand span,.dk .nav a{color:var(--paper)}
@media (max-width:820px){:root{--hdr:56px} .hdr{top:8px;left:12px;right:12px;padding:0 6px 0 8px} .brand img{width:46px} .brand span{font-size:15px} .nav,.hdr>.btn{display:none} .burger{display:grid}}

body{background:var(--green-d)}
.h{height:100svh;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--hdr) + 20px) var(--pad) 30px;color:var(--paper);overflow:hidden;position:relative}
.word{position:relative;font:400 100px/.8 var(--disp);white-space:nowrap;letter-spacing:-.01em;height:.8em;margin:auto auto 0;display:inline-block;align-self:center}
.word .ly{position:absolute;inset:0;color:transparent;background:var(--c);-webkit-background-clip:text;background-clip:text;clip-path:inset(var(--a) 0 var(--b) 0);transition:transform .6s cubic-bezier(.2,.9,.2,1)}
.dust{position:absolute;left:0;right:0;top:-.08em;height:.16em;pointer-events:none}
.dust i{position:absolute;border-radius:50%;background:#fff}
.sub{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-top:auto;padding-top:5vh}
.sub p{font-size:clamp(17px,1.5vw,21px);max-width:440px;color:rgba(247,240,226,.85)}
.sub p b{color:var(--apple);font-weight:600}
.bt{display:flex;gap:8px;flex-wrap:wrap}
.k{position:absolute;top:calc(var(--hdr) + 44px);left:50%;transform:translateX(-50%);font:italic 400 clamp(20px,2vw,30px)/1 var(--it);color:var(--apple)}
@media (max-width:820px){.sub{flex-direction:column;align-items:stretch;gap:16px}.bt .btn{flex:1}.k{top:calc(var(--hdr) + 30px)}}

</style></head><body class="dk">
<header class="hdr"><a class="brand" href="#"><img src="../img/logo.svg" alt=""><span>Белёвская<br>пастила</span></a>
<nav class="nav"><a href="#">Каталог</a><a href="#">Как делаем</a><a href="#">Где купить</a><a href="#">Оптом и СТМ</a><a href="#">Контакты</a></nav>
<a class="btn sm" href="#">Где купить</a><button class="burger"><i></i></button></header>
<section class="h"><div class="k">белёвская, с 1881 года</div>
<div class="word" id="w"></div>
<div class="sub"><p>Из <b>антоновских яблок</b> и&nbsp;взбитых белков. Вручную, в&nbsp;русской печи XIX века</p>
<div class="bt"><a class="btn light" href="#">Каталог →</a><a class="btn glass" href="#">Где купить</a></div></div></section>
<script>
const L=[['#F4E3C3',0,72],['#D9A86C',28,47],['#F0D9B0',53,27],['#C48A50',73,0]],w=document.getElementById('w');
w.innerHTML=L.map(([c,a,b])=>`<span class="ly" style="--c:${c};--a:${a}%;--b:${b}%">ПАСТИЛА</span>`).join('')+'<span style="visibility:hidden">ПАСТИЛА</span><div class="dust" id="d"></div>';
function fit(){w.style.fontSize='100px';const k=(w.parentNode.clientWidth-2*parseFloat(getComputedStyle(w.parentNode).paddingLeft))/w.offsetWidth;w.style.fontSize=Math.min(100*k,innerHeight*.42)+'px'}
fit();addEventListener('resize',fit);document.fonts.ready.then(fit);
const d=document.getElementById('d');for(let i=0;i<120;i++){const e=document.createElement('i'),s=2+Math.random()*6;e.style.cssText=`left:${3+Math.random()*94}%;top:${Math.random()*100}%;width:${s}px;height:${s}px;opacity:${.5+Math.random()*.5}`;d.appendChild(e)}
const ly=[...document.querySelectorAll('.ly')];
addEventListener('mousemove',e=>{const x=e.clientX/innerWidth-.5;ly.forEach((l,i)=>l.style.transform=`translateX(${x*(i%2?-1:1)*(14+i*6)}px)`)});

document.querySelectorAll('h1,p').forEach(e=>{e.innerHTML=e.innerHTML.replace(/(^|[\s>(« ])(в|и|с|к|у|о|а|на|из|по|за|от|до|не|без|для|при|что|как|или|но)\s+/gi,'$1$2 ')});</script></body></html>
