<title>Что подарить за минуту</title>
<style>

.wrap{width:min(1050px,calc(100% - 40px));margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:8px}
header span{font:italic 21px Georgia;color:var(--red)}a{color:inherit;text-underline-offset:4px}
main{padding:38px 0 44px;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:start}
h1,h2,p{margin:0}h1{font:normal clamp(44px,7vw,86px)/.88 Georgia;letter-spacing:-.07em;margin-bottom:12px}h1 em{color:var(--red);font-weight:normal;display:block}
.intro{margin-bottom:23px}
fieldset{border:0;padding:0;margin:0 0 13px;min-width:0}legend{font-weight:650;margin-bottom:6px}
.options{display:flex;flex-wrap:wrap;gap:6px}
.option{position:relative;cursor:pointer}.option input{position:absolute;opacity:0;width:1px;height:1px}.option span{display:block;padding:6px 10px;background:#eadfc7;border-radius:999px;font-size:13px}
.option input:checked+span{background:var(--ink);color:#fff6df}.option input:focus-visible+span,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button{background:var(--red);color:#fff2d8;padding:10px 16px;border:0;border-radius:999px;font:inherit;font-weight:650;cursor:pointer}
.result{background:#fff7e6;padding:20px;border:1px solid var(--line);border-radius:9px;box-shadow:0 13px 26px #50201816}
.result img{display:block;width:145px;height:145px;margin:4px auto;object-fit:contain;transform:rotate(8deg)}
.result h2{color:var(--red);font:italic 31px Georgia;margin-bottom:5px}
.result p{font-size:13px}
ol{margin:12px 0;padding-left:28px}li{padding:9px 0;border-top:1px solid var(--line)}li::marker{color:var(--red);font:italic 18px Georgia}
li strong{display:block}
.shops{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.shops a{display:inline-block;border-radius:999px;padding:5px 10px;color:white;text-decoration:none;font-size:12px;font-weight:650}
.shops a:first-child{background:#782468}.shops a:last-child{background:#164bc8}
.shops a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
@media(max-width:740px){.wrap{width:calc(100% - 28px)}header span{font-size:17px}header a{font-size:12px;white-space:nowrap}main{padding:24px 0;grid-template-columns:1fr;gap:15px}.intro{margin-bottom:14px}h1{font-size:clamp(43px,11vw,66px)}.result{padding:13px}.result img{display:none}}
</style>

<body>
<header class="wrap"><span>Декабрьская коллекция</span><a href="../advent/">К адвенту</a></header>
<main class="wrap">
<section>
<h1>Что подарить <em>за минуту</em></h1><p class="intro">Три ответа, три идеи для подарка.</p>
<form id="picker">
<fieldset><legend>Кому выбираешь?</legend><div class="options" id="recipient"></div></fieldset>
<fieldset><legend>Что человеку нравится?</legend><div class="options" id="interest"></div></fieldset>
<fieldset><legend>Какой бюджет?</legend><div class="options" id="budget"></div></fieldset>
<button type="submit">Подобрать подарок</button>
</form>
</section>
<section class="result" id="result" aria-live="polite" tabindex="-1">
<div id="empty"><img src="../winter-stickers/png/18.png" alt=""><h2>Три идеи для подарка</h2><p>Появятся после выбора.</p></div>
<div id="ideas" hidden><h2 id="heading"></h2><p id="summary"></p><ol id="gifts"></ol><p>Кнопки открывают поиск по товару. Цены и наличие зависят от магазина.</p></div>
</section>
</main>
